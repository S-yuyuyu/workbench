<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宋振玉的工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&family=LXGW+WenKai:wght@300;400;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--primary:#5B9BD5;--primary-rgb:91,155,213;--primary-light:#E8F0FE;--primary-dark:#3A7AB8;--accent:#7EC8E3;--bg:#F5F8FC;--surface:#FFFFFF;--surface-alt:#F8FAFC;--text:#1A2B3C;--text-sec:#6B7B8D;--text-ter:#A0AEBB;--border:#E2E8F0;--divider:#EDF2F7;--success:#48BB78;--success-light:#E6F9ED;--danger:#FC5C65;--sidebar-w:68px;--radius:14px;--radius-sm:10px;--radius-xs:8px;--font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;--shadow-sm:0 1px 3px rgba(var(--primary-rgb),.06);--shadow-md:0 4px 12px rgba(var(--primary-rgb),.08);--ease:cubic-bezier(.4,0,.2,1)}
.theme-pink{--primary:#E88BB0;--primary-rgb:232,139,176;--primary-light:#FDE8F0;--primary-dark:#D06B90;--accent:#F0A0C0}
.theme-mint{--primary:#5BC5A7;--primary-rgb:91,197,167;--primary-light:#E8FDF0;--primary-dark:#3BA78A;--accent:#7EDDC5}
.theme-cream{--primary:#D4A855;--primary-rgb:212,168,85;--primary-light:#FDF8E8;--primary-dark:#B88E3A;--accent:#E0C070}
.font-default{--font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif}
.font-serif{--font:'Noto Serif SC',Georgia,serif}
.font-kai{--font:'LXGW WenKai',cursive,serif}
.font-round{--font:'ZCOOL XiaoWei',serif}
.font-hand{--font:'Ma Shan Zheng',cursive}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:15px;color:var(--text);background:var(--bg)}
input,textarea,select,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;outline:none}
::-webkit-scrollbar{width:0;display:none}
.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--accent));transition:opacity .6s var(--ease),transform .6s var(--ease)}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-inner{text-align:center;color:#fff;padding:24px}
.fish-wrap{margin-bottom:28px;animation:fishFloat 3s ease-in-out infinite;text-align:center}
@keyframes fishFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.splash-date{font-size:13px;opacity:.75;margin-bottom:12px;letter-spacing:1px;text-align:center}
.splash-greeting{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}
.splash-quote{font-size:14px;opacity:.8;margin-bottom:16px;cursor:pointer;padding:4px 12px;border-radius:8px;transition:background .2s var(--ease);display:inline-block;text-align:center}
.splash-quote:hover{background:rgba(255,255,255,.15)}
.splash-btn{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.3);padding:14px 40px;border-radius:50px;font-size:15px;font-weight:500;letter-spacing:1px;transition:all .3s var(--ease);display:block;margin:0 auto}
.splash-btn:active{background:rgba(255,255,255,.35);transform:scale(1.04)}
#app{display:flex;height:100%;width:100%}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--divider);display:flex;flex-direction:column;align-items:center;padding:12px 0;z-index:50}
.sidebar-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;margin-bottom:8px;cursor:pointer}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;width:100%;overflow-y:auto;padding-bottom:8px;border-bottom:1px solid var(--divider)}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:3px;color:var(--text-ter);font-size:10px;cursor:pointer;transition:all .2s var(--ease);position:relative}
.nav-item .nav-icon{font-size:22px;line-height:1;transition:transform .2s var(--ease)}
.nav-item .nav-label{font-size:10px;white-space:nowrap}
.nav-item:hover{color:var(--primary)}
.nav-item.active{color:var(--primary);background:var(--primary-light)}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-item.active .nav-icon{transform:scale(1.15)}
.nav-section-label{font-size:9px;color:var(--text-ter);text-align:center;padding:6px 0 2px;letter-spacing:1px}
.sidebar-bottom{padding-top:8px;border-top:1px solid var(--divider);width:100%}
#content{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:20px 16px 100px;opacity:0;transform:translateX(20px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto}
.home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.home-greeting{font-size:13px;color:var(--text-sec)}
.home-greeting strong{color:var(--text);font-size:16px;display:block;margin-top:2px}
.checkin-btn{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);transition:all .2s var(--ease)}
.checkin-btn:active{transform:scale(.95)}.checkin-btn.done{background:var(--success)}
.hero-card{border-radius:var(--radius);padding:22px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;margin-bottom:20px;box-shadow:0 8px 28px rgba(var(--primary-rgb),.3);position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.15),transparent 60%)}
.hero-left{position:relative;z-index:1}
.hero-date-badge{display:inline-block;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:11px;margin-bottom:10px}
.hero-title{font-size:20px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:13px;opacity:.85}
.progress-ring-wrap{position:relative;z-index:1;width:80px;height:80px}
.progress-ring-wrap svg{transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:7}
.progress-ring-fg{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.progress-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#fff}
.progress-text strong{font-size:20px;font-weight:700}
.stats-row{display:flex;gap:10px;margin-bottom:20px}
.stat-card{flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-num{font-size:24px;font-weight:700;color:var(--primary)}
.stat-label{font-size:11px;color:var(--text-sec);margin-top:2px}
.today-bar{background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.today-bar-title{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.today-bar-title span{font-size:10px;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:10px}
.today-course-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--divider)}
.today-course-row:last-child{border-bottom:none}
.today-course-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.today-course-name{flex:1;font-size:13px;font-weight:500}
.today-course-time{font-size:11px;color:var(--text-sec)}
.today-empty{font-size:13px;color:var(--text-ter);text-align:center;padding:12px 0}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.module-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:10px}
.module-card:active{transform:scale(.97)}
.module-card .mc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.module-card .mc-info{flex:1;min-width:0}
.module-card .mc-name{font-size:13px;font-weight:500}
.module-card .mc-status{font-size:11px;color:var(--text-sec);margin-top:2px}
.module-card .mc-check{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.mc-check.done{background:var(--success);color:#fff}
.mc-check.undone{background:var(--divider);color:var(--text-ter)}
.quick-actions{display:flex;gap:10px}
.qa-btn{flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;font-size:12px;color:var(--text-sec);box-shadow:var(--shadow-sm);transition:all .2s var(--ease);cursor:pointer}
.qa-btn:active{background:var(--primary-light);color:var(--primary)}
.qa-btn .qa-icon{font-size:20px;display:block;margin-bottom:4px}
.checkin-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.checkin-bar .cb-left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sec)}
.checkin-bar .cb-dot{width:8px;height:8px;border-radius:50%;background:var(--divider)}
.checkin-bar .cb-dot.on{background:var(--success)}
.checkin-bar .cb-btn{padding:6px 16px;border-radius:16px;font-size:12px;font-weight:500;background:var(--primary-light);color:var(--primary);transition:all .2s var(--ease)}
.checkin-bar .cb-btn.on{background:var(--success-light);color:var(--success)}
.page-head{margin-bottom:18px}
.page-head h2{font-size:20px;font-weight:700;margin-bottom:2px}
.page-head p{font-size:13px;color:var(--text-sec)}
.todo-section{margin-bottom:24px}
.todo-section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.todo-section-title .badge{font-size:10px;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:10px;font-weight:400}
.todo-item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);transition:all .2s var(--ease)}
.todo-item.done{opacity:.55}
.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0;font-size:12px;color:transparent}
.todo-check.on{background:var(--success);border-color:var(--success);color:#fff}
.todo-text{flex:1;font-size:14px}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-ter)}
.todo-del{color:var(--text-ter);font-size:16px;padding:4px;cursor:pointer;transition:color .2s}
.todo-del:hover{color:var(--danger)}
.add-item-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-ter);font-size:13px;transition:all .2s var(--ease);margin-top:4px;cursor:pointer}
.add-item-btn:active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.history-browser{background:var(--surface);border-radius:var(--radius);padding:16px;margin-top:8px;box-shadow:var(--shadow-md)}
.history-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.history-header h3{font-size:15px;font-weight:600}
.history-nav{display:flex;align-items:center;gap:0}
.history-arrow{width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s var(--ease)}
.history-arrow:active{background:var(--primary);color:#fff}
.history-date-display{padding:0 8px;font-size:14px;font-weight:500;color:var(--primary);cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:8px;height:34px;min-width:120px;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.history-date-display:hover{border-color:var(--primary)}
.history-date-display.today-tag{color:var(--success);border-color:var(--success-light)}
.calendar-popup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);padding:12px;margin-bottom:12px;display:none}
.calendar-popup.show{display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .cal-title{font-size:14px;font-weight:600;color:var(--text)}
.cal-head-btn{width:28px;height:28px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s var(--ease)}
.cal-head-btn:active{background:var(--primary);color:#fff}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;text-align:center}
.cal-weekday{font-size:10px;color:var(--text-ter);padding:4px 0;font-weight:500}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s var(--ease);color:var(--text);position:relative}
.cal-day:hover{background:var(--primary-light)}
.cal-day.other-month{color:var(--text-ter);opacity:.4}
.cal-day.today{background:var(--primary-light);color:var(--primary);font-weight:700}
.cal-day.selected{background:var(--primary);color:#fff;font-weight:600}
.cal-day.has-tasks::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
.history-list{min-height:60px}
.history-empty{text-align:center;color:var(--text-ter);font-size:13px;padding:20px 0}
.week-selector{display:flex;align-items:center;gap:12px;margin-bottom:10px;background:var(--surface);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow-sm)}
.week-selector button{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.week-selector button:active{background:var(--primary);color:#fff}
.week-selector .week-text{flex:1;text-align:center;font-size:14px;font-weight:500}
.week-date-range{background:var(--surface);border-radius:var(--radius-sm);padding:8px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm);text-align:center;font-size:12px;color:var(--text-sec)}
.timetable{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tt-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;min-width:680px}
.tt-table th{background:var(--primary-light);color:var(--primary);font-weight:600;padding:8px 4px;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--primary)}
.tt-table th:first-child{border-radius:var(--radius-xs) 0 0 0;width:72px}
.tt-table .th-date{display:block;font-size:9px;font-weight:400;color:var(--text-sec);margin-top:1px}
.tt-table td{border:1px solid var(--divider);padding:4px;vertical-align:top;text-align:center;min-height:72px;position:relative}
.tt-table td:first-child{border:none;background:var(--surface-alt);font-size:10px;color:var(--text-sec);padding:8px 4px;line-height:1.6}
.tt-slot-label{font-weight:600;color:var(--text);font-size:11px;display:block}
.tt-slot-time{font-size:9px;color:var(--text-ter);display:block;margin-top:2px}
.course-card{border-radius:7px;padding:5px 6px;font-size:10px;line-height:1.4;color:#fff;position:relative;cursor:pointer;transition:all .2s var(--ease);min-height:36px;display:flex;flex-direction:column;justify-content:center;margin:2px 0;text-align:left}
.course-card:active{transform:scale(.96)}
.course-card.inactive{opacity:.22;filter:grayscale(.3)}
.course-card .cc-name{font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-card .cc-meta{font-size:9px;opacity:.88;margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.course-card .cc-weeks{font-size:9px;opacity:.75;margin-top:1px}
.exercise-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.exercise-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.exercise-info{flex:1}
.exercise-name{font-size:14px;font-weight:500}
.exercise-detail{font-size:12px;color:var(--text-sec);margin-top:2px}
.exercise-del{color:var(--text-ter);padding:6px;cursor:pointer;font-size:16px}
.study-tabs{display:flex;gap:8px;margin-bottom:16px}
.study-tab{flex:1;padding:10px;border-radius:var(--radius-sm);text-align:center;font-size:13px;font-weight:500;background:var(--surface);color:var(--text-sec);box-shadow:var(--shadow-sm);transition:all .2s var(--ease);cursor:pointer}
.study-tab.on{background:var(--primary);color:#fff;box-shadow:var(--shadow-md)}
.study-item{background:var(--surface);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.study-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.study-info{flex:1}
.study-title{font-size:14px;font-weight:500}
.study-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.study-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;cursor:pointer}
.study-status.reading{background:#FEF3E2;color:#ED8936}
.study-status.done{background:var(--success-light);color:var(--success)}
.study-del{color:var(--text-ter);padding:6px;cursor:pointer;font-size:16px}
.finance-summary{display:flex;gap:10px;margin-bottom:18px}
.fin-card{flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.fin-card .fin-label{font-size:11px;color:var(--text-sec);margin-bottom:4px}
.fin-card .fin-amount{font-size:20px;font-weight:700}
.fin-card.income .fin-amount{color:var(--success)}
.fin-card.expense .fin-amount{color:var(--danger)}
.fin-card.balance .fin-amount{color:var(--primary)}
.fin-record{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.fin-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.fin-info{flex:1}
.fin-cat{font-size:13px;font-weight:500}
.fin-note{font-size:11px;color:var(--text-sec);margin-top:1px}
.fin-amount-tag{font-size:15px;font-weight:600}
.fin-amount-tag.inc{color:var(--success)}
.fin-amount-tag.exp{color:var(--danger)}
.fin-del{color:var(--text-ter);padding:6px;cursor:pointer;font-size:16px}
.settings-section{margin-bottom:24px}
.settings-title{font-size:14px;font-weight:600;color:var(--text-sec);margin-bottom:10px;padding-left:2px}
.setting-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;box-shadow:var(--shadow-sm);cursor:pointer}
.setting-row .sr-left{display:flex;align-items:center;gap:10px}
.setting-row .sr-icon{font-size:18px}
.setting-row .sr-label{font-size:14px}
.theme-options{display:flex;gap:10px;flex-wrap:wrap}
.theme-dot{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s var(--ease)}
.theme-dot.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
.theme-dot.blue{background:linear-gradient(135deg,#5B9BD5,#7EC8E3)}
.theme-dot.pink{background:linear-gradient(135deg,#E88BB0,#F0A0C0)}
.theme-dot.mint{background:linear-gradient(135deg,#5BC5A7,#7EDDC5)}
.theme-dot.cream{background:linear-gradient(135deg,#D4A855,#E0C070)}
.font-options{display:flex;gap:8px;flex-wrap:wrap}
.font-chip{padding:8px 16px;border-radius:20px;background:var(--surface);border:2px solid var(--border);font-size:13px;cursor:pointer;transition:all .2s var(--ease);box-shadow:var(--shadow-sm)}
.font-chip.on{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.sidebar-toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;box-shadow:var(--shadow-sm)}
.sidebar-toggle .st-name{flex:1;font-size:14px}
.toggle-switch{width:44px;height:24px;border-radius:12px;background:var(--border);position:relative;cursor:pointer;transition:background .2s var(--ease)}
.toggle-switch.on{background:var(--primary)}
.toggle-switch::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle-switch.on::after{transform:translateX(20px)}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:24px 20px;transform:translateY(100%);transition:transform .3s var(--ease)}
.modal-overlay.show .modal-box{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{font-size:17px;font-weight:600}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--divider);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-sec);cursor:pointer}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--text-sec);margin-bottom:6px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:14px;outline:none;transition:border-color .2s;background:var(--surface-alt)}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--primary)}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .2s var(--ease)}
.btn-cancel{background:var(--divider);color:var(--text-sec)}
.btn-save{background:var(--primary);color:#fff}
.btn-save:active{opacity:.85}
.type-pills{display:flex;gap:8px;margin-bottom:14px}
.type-pill{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--surface-alt);color:var(--text-sec);cursor:pointer;transition:all .2s var(--ease);border:1px solid var(--border)}
.type-pill.on{background:var(--primary);color:#fff;border-color:var(--primary)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp .4s var(--ease) forwards}
.delay-1{animation-delay:.05s}.delay-2{animation-delay:.1s}.delay-3{animation-delay:.15s}.delay-4{animation-delay:.2s}.delay-5{animation-delay:.25s}

function migrateTodos(){const t=state.todos;if(!t||!t.byDate){const tk=todayKey(),tm=tomorrowKey();const todayList=(t&&t.today)?t.today.map(todo=>({...todo,completedAt:todo.done?Date.now():null})):[{text:'早晨一杯温水',done:false,id:1,completedAt:null}];const tmrwList=(t&&t.tomorrow)?t.tomorrow.map(todo=>({...todo,completedAt:null})):[];state.todos={byDate:{},activeDate:null,showCalendar:false};state.todos.byDate[tk]=todayList;state.todos.byDate[tm]=tmrwList;save('todos')}}

function todayKey(){return new Date().toISOString().slice(0,10)}
function tomorrowKey(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function formatDate(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function formatWeekday(d){return['日','一','二','三','四','五','六'][d.getDay()]}

function formatMD(d){return(d.getMonth()+1)+'/'+d.getDate()}
function formatWeeks(weeks){if(!weeks||!weeks.length)return'';const rng=[];let s=weeks[0],e=weeks[0];for(let i=1;i<weeks.length;i++){if(weeks[i]===e+1)e=weeks[i];else{rng.push([s,e]);s=e=weeks[i]}}rng.push([s,e]);return rng.map(([a,b])=>a===b?'第'+a+'周':a+'-'+b+'周').join('、')}
function calcWeek(){const sd=new Date(state.schedule.startDate+'T00:00:00');const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const diff=Math.floor((today-sd)/(7*24*3600*1000));return Math.max(1,Math.min(diff+1,20))}
function getWeekStartDate(weekNum){return addDays(new Date(state.schedule.startDate+'T00:00:00'),(weekNum-1)*7)}

function getModuleSubText(id){switch(id){case'todo':const tl=state.todos.byDate[todayKey()]||[];return tl.filter(x=>x.done).length+'/'+tl.length+' 已完成';case'schedule':return'第'+calcWeek()+'周 · 今日'+getTodayCourses().length+'节课';case'exercise':return'已添加'+state.exercises.length+'项运动';case'study':return(state.study.literature.length+state.study.programs.length)+'个学习任务';case'finance':{const td=state.finance.records.filter(r=>r.date===todayKey());return'今日'+td.length+'笔记录'}default:return''}}
function checkTodoAutoConvert(){const n=new Date(),last=state.lastTodoCheck;const t7=new Date(n.getFullYear(),n.getMonth(),n.getDate(),7);if(n>=t7&&last<t7.getTime()){const tk=todayKey(),tm=tomorrowKey();if(!state.todos.byDate[tk])state.todos.byDate[tk]=[];(state.todos.byDate[tm]||[]).forEach(t=>{if(!t.done)state.todos.byDate[tk].push({...t,id:genId(),completedAt:null})});delete state.todos.byDate[tm];state.lastTodoCheck=Date.now();save('todos');save('lastTodoCheck')}}
function renderTodo(){const tk=todayKey();const todayList=state.todos.byDate[tk]||[];const activeDate=state.todos.activeDate||tk;const historyList=state.todos.byDate[activeDate]||[];const isToday=activeDate===tk;const historyItems=isToday?historyList.filter(t=>t.done):historyList;let calHTML=state.todos.showCalendar?buildCalendar(new Date(activeDate+'T00:00:00'),activeDate):'';document.getElementById('page-todo').innerHTML=checkinBar('todo')+'<div class="page-head"><h2>待办事项</h2><p>'+formatDate(new Date())+' 星期'+formatWeekday(new Date())+'</p></div><div class="todo-section"><div class="todo-section-title">📋 今日待办 <span class="badge">'+todayList.filter(t=>t.done).length+'/'+todayList.length+'</span></div>'+todayList.map((t,i)=>todoItemHTML(t,i,tk)).join('')+'<button class="add-item-btn" onclick="showAddTodo()">+ 添加待办</button></div><div class="history-browser"><div class="history-header"><h3>📅 待办回顾</h3><div class="history-nav"><div class="history-arrow" onclick="historyShift(-1)">‹</div><div class="history-date-display'+(isToday?' today-tag':'')+'" onclick="toggleCalendar()">'+(isToday?'今天':formatMD(new Date(activeDate+'T00:00:00'))+' ('+DAY_NAMES[(new Date(activeDate+'T00:00:00')).getDay()||7-1]+')')+'</div><div class="history-arrow" onclick="historyShift(1)">›</div></div></div>'+calHTML+'<div class="history-list">'+(historyItems.length?historyItems.map(t=>'<div class="todo-item'+(t.done?' done':'')+'"><div class="todo-check '+(t.done?'on':'')+'">'+(t.done?'✓':'')+'</div><div class="todo-text">'+esc(t.text)+'</div>'+(t.completedAt?'<div style="font-size:10px;color:var(--text-ter);white-space:nowrap">'+new Date(t.completedAt).toTimeString().slice(0,5)+'</div>':'')+'</div>').join(''):'<div class="history-empty">'+(isToday?'今日暂无已完成的待办':'该日无待办记录')+'</div>')+'</div></div>'}
function todoItemHTML(t,i,dk){return'<div class="todo-item'+(t.done?' done':'')+'"><div class="todo-check '+(t.done?'on':'')+'" onclick="toggleTodo(\''+dk+'\','+i+')">'+(t.done?'✓':'')+'</div><div class="todo-text">'+esc(t.text)+'</div><div class="todo-del" onclick="delTodo(\''+dk+'\','+i+')">×</div></div>'}
function toggleTodo(dk,i){const l=state.todos.byDate[dk];if(!l||!l[i])return;l[i].done=!l[i].done;l[i].completedAt=l[i].done?Date.now():null;save('todos');renderTodo();if(currentPage==='home')renderHome()}
function delTodo(dk,i){state.todos.byDate[dk].splice(i,1);save('todos');renderTodo();if(currentPage==='home')renderHome()}
function showAddTodo(){showModal('添加待办','<div class="modal-field"><label>内容</label><input id="m-todo-text" placeholder="输入待办内容..." autofocus></div>',()=>{const text=document.getElementById('m-todo-text').value.trim();if(!text)return false;const tk=todayKey();if(!state.todos.byDate[tk])state.todos.byDate[tk]=[];state.todos.byDate[tk].push({text,done:false,id:genId(),completedAt:null});save('todos');renderTodo();renderHome();return true})}
function historyShift(dir){const cur=state.todos.activeDate||todayKey();state.todos.activeDate=dateKey(addDays(new Date(cur+'T00:00:00'),dir));save('todos');renderTodo()}
function toggleCalendar(){state.todos.showCalendar=!state.todos.showCalendar;save('todos');renderTodo()}
function buildCalendar(viewDate,selectedKey){const y=viewDate.getFullYear(),m=viewDate.getMonth();const first=new Date(y,m,1);const startDow=(first.getDay()+6)%7;const daysInMonth=new Date(y,m+1,0).getDate();const todayStr=todayKey();let cal='<div class="calendar-popup show"><div class="cal-head"><div class="cal-head-btn" onclick="calNav(-1)">‹</div><div class="cal-title">'+y+'年'+(m+1)+'月</div><div class="cal-head-btn" onclick="calNav(1)">›</div></div><div class="cal-weekdays">'+DAY_NAMES.map(d=>'<div class="cal-weekday">'+d+'</div>').join('')+'</div><div class="cal-days">';for(let i=0;i<startDow;i++){const prevDays=new Date(y,m,0).getDate();const day=prevDays-startDow+i+1;cal+='<div class="cal-day other-month" onclick="selectCalDate(\''+dateKey(new Date(y,m-1,day))+'\')">'+day+'</div>'}for(let d=1;d<=daysInMonth;d++){const dk=dateKey(new Date(y,m,d));const cls=['cal-day'];if(dk===todayStr)cls.push('today');if(dk===selectedKey)cls.push('selected');if(dk!==todayStr&&dk!==selectedKey&&Object.keys(state.todos.byDate).includes(dk))cls.push('has-tasks');cal+='<div class="'+cls.join(' ')+'" onclick="selectCalDate(\''+dk+'\')">'+d+'</div>'}const total=startDow+daysInMonth;const rem=(7-total%7)%7;for(let d=1;d<=rem;d++)cal+='<div class="cal-day other-month" onclick="selectCalDate(\''+dateKey(new Date(y,m+1,d))+'\')">'+d+'</div>';return cal+'</div></div>'}
function calNav(dir){const cur=state.todos.activeDate||todayKey();const d=new Date(cur+'T00:00:00');d.setMonth(d.getMonth()+dir);d.setDate(1);state.todos.activeDate=dateKey(d);save('todos');renderTodo()}
function selectCalDate(dk){state.todos.activeDate=dk;state.todos.showCalendar=false;save('todos');renderTodo()}
function renderSchedule(){const el=document.getElementById('page-schedule');const week=state.schedule.currentWeek;const ws=getWeekStartDate(week);let dayHeaders='';for(let i=0;i<7;i++){const d=addDays(ws,i);dayHeaders+='<th>'+DAY_NAMES[i]+'<span class="th-date">'+formatMD(d)+'</span></th>'}el.innerHTML=checkinBar('schedule')+'<div class="page-head"><h2>我的课表</h2><p>旗山校区 · 第'+week+'周</p></div><div class="week-selector"><button onclick="changeWeek(-1)">‹</button><div class="week-text">第 '+week+' 周</div><button onclick="changeWeek(1)">›</button></div><div class="week-date-range">📅 '+getWeekRangeStr(week)+'</div><div class="timetable"><table class="tt-table"><thead><tr><th></th>'+dayHeaders+'</tr></thead><tbody>'+TIME_SLOTS.map((ts,si)=>'<tr><td><span class="tt-slot-label">'+ts.label+'</span><span class="tt-slot-time">'+ts.start+'</span><span class="tt-slot-time">'+ts.end+'</span></td>'+[1,2,3,4,5,6,7].map(day=>renderScheduleCell(day,si,week)).join('')+'</tr>').join('')+'</tbody></table></div>'}
function renderScheduleCell(day,slot,week){const courses=state.schedule.courses.filter(c=>c.day===day&&c.slot===slot);if(!courses.length)return'<td></td>';const active=courses.filter(c=>c.weeks.includes(week));const inactive=courses.filter(c=>!c.weeks.includes(week));const all=[...active,...inactive];return'<td>'+all.map(c=>{const col=COURSE_COLORS[c.color%COURSE_COLORS.length];const isActive=c.weeks.includes(week);return'<div class="course-card'+(all.length>1?' multi':'')+(isActive?'':' inactive')+'" style="background:'+col+'" title="'+c.name+'\n'+c.teacher+' · '+c.room+'\n'+c.periods+'节 · '+formatWeeks(c.weeks)+'"><div class="cc-name">'+esc(c.name)+'</div><div class="cc-meta"><span>'+esc(c.teacher)+'</span> · <span>'+esc(c.room)+'</span></div><div class="cc-weeks">'+c.periods+'节 · '+formatWeeks(c.weeks)+'</div></div>'}).join('')+'</td>'}
function changeWeek(d){state.schedule.currentWeek=Math.max(1,Math.min(20,state.schedule.currentWeek+d));save('schedule');renderSchedule()}
function setupAutoWeek(){const w=calcWeek();if(w!==state.schedule.currentWeek&&w>=1&&w<=20){state.schedule.currentWeek=w;save('schedule')}}

function showAddExercise(){showModal('添加运动','<div class="modal-field"><label>运动名称</label><input id="m-ex-name" placeholder="如：跑步、游泳..." autofocus></div><div class="modal-field"><label>运动详情</label><input id="m-ex-detail" placeholder="如：30分钟/5公里..."></div><div class="modal-field"><label>选择图标</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+EXERCISE_ICONS.map((ic,i)=>'<span class="ex-icon-pick'+(i===0?' on':'')+'" data-icon="'+ic+'" onclick="pickExIcon(this)" style="font-size:24px;cursor:pointer;padding:6px;border-radius:8px;border:2px solid '+(i===0?'var(--primary)':'transparent')+';background:'+(i===0?'var(--primary-light)':'transparent')+'">'+ic+'</span>').join('')+'</div></div>',()=>{const name=document.getElementById('m-ex-name').value.trim();if(!name)return false;state.exercises.push({name,detail:document.getElementById('m-ex-detail').value.trim(),icon:document.querySelector('.ex-icon-pick.on')?.dataset.icon||'🏃',id:genId()});save('exercises');renderExercise();renderHome();return true})}
function pickExIcon(el){document.querySelectorAll('.ex-icon-pick').forEach(e=>{e.classList.remove('on');e.style.borderColor='transparent';e.style.background='transparent'});el.classList.add('on');el.style.borderColor='var(--primary)';el.style.background='var(--primary-light)'}

function renderFinance(){const tk=todayKey(),month=tk.slice(0,7);const monthRecs=state.finance.records.filter(r=>r.date.startsWith(month));const monthInc=monthRecs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);const monthExp=monthRecs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);const allRecs=[...state.finance.records].reverse().slice(0,30);document.getElementById('page-finance').innerHTML=checkinBar('finance')+'<div class="page-head"><h2>财务记账</h2><p>本月收支概览</p></div><div class="finance-summary"><div class="fin-card income"><div class="fin-label">本月收入</div><div class="fin-amount">+'+monthInc.toFixed(2)+'</div></div><div class="fin-card expense"><div class="fin-label">本月支出</div><div class="fin-amount">-'+monthExp.toFixed(2)+'</div></div><div class="fin-card balance"><div class="fin-label">本月结余</div><div class="fin-amount">'+(monthInc-monthExp).toFixed(2)+'</div></div></div><div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600">收支记录</span><button onclick="showAddFinance()" style="background:var(--primary);color:#fff;padding:6px 14px;border-radius:14px;font-size:12px;cursor:pointer">+ 记一笔</button></div>'+(allRecs.length===0?'<div style="text-align:center;color:var(--text-ter);padding:40px 0;font-size:14px">暂无记账记录</div>':'')+allRecs.map(r=>'<div class="fin-record"><div class="fin-icon" style="background:'+(r.type==='income'?'var(--success-light)':'#FDE8E9')+'">'+(r.type==='income'?'📈':'📉')+'</div><div class="fin-info"><div class="fin-cat">'+esc(r.category)+'</div><div class="fin-note">'+r.date+' · '+esc(r.note||'无备注')+'</div></div><div class="fin-amount-tag '+(r.type==='income'?'inc':'exp')+'">'+(r.type==='income'?'+':'-')+r.amount.toFixed(2)+'</div><div class="fin-del" onclick="delFinance(\''+r.id+'\')">×</div></div>').join('')}
function showAddFinance(){showModal('记一笔','<div class="type-pills"><div class="type-pill on" data-type="expense" onclick="pickFinType(this)">支出</div><div class="type-pill" data-type="income" onclick="pickFinType(this)">收入</div></div><div class="modal-field"><label>金额</label><input id="m-fin-amount" type="number" placeholder="0.00" step="0.01" autofocus></div><div class="modal-field"><label>分类</label><input id="m-fin-cat" placeholder="如：餐饮、交通、工资..."></div><div class="modal-field"><label>备注</label><input id="m-fin-note" placeholder="可选备注"></div>',()=>{const amount=parseFloat(document.getElementById('m-fin-amount').value);if(isNaN(amount)||amount<=0)return false;state.finance.records.push({type:document.querySelector('.type-pill.on')?.dataset.type||'expense',amount,category:document.getElementById('m-fin-cat').value.trim()||'其他',note:document.getElementById('m-fin-note').value.trim(),date:todayKey(),id:genId()});save('finance');renderFinance();renderHome();return true})}

function showEditWeek(){showModal('设置教学周','<div class="modal-field"><label>当前是第几周</label><input id="m-week" type="number" min="1" max="20" value="'+state.schedule.currentWeek+'"></div><div class="modal-field"><label>学期开始日期（第1周周一）</label><input id="m-start" type="date" value="'+state.schedule.startDate+'"></div>',()=>{const w=parseInt(document.getElementById('m-week').value);const s=document.getElementById('m-start').value;if(isNaN(w)||w<1)return false;state.schedule.currentWeek=w;if(s)state.schedule.startDate=s;save('schedule');renderSchedule();renderSettings();return true})}
function showEditCourses(){const c=state.schedule.courses;const DM=['','周一','周二','周三','周四','周五','周六','周日'];showModal('编辑课程表','<div style="max-height:50vh;overflow-y:auto;margin-bottom:12px">'+c.map((cr,i)=>'<div style="display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:6px;background:var(--surface-alt);border-radius:8px;border-left:4px solid '+COURSE_COLORS[cr.color%COURSE_COLORS.length]+'"><div style="flex:1;font-size:13px"><strong>'+esc(cr.name)+'</strong><br><span style="color:var(--text-sec);font-size:11px">'+DM[cr.day]+' '+cr.periods+'节 · '+esc(cr.teacher)+' · '+esc(cr.room)+' · '+formatWeeks(cr.weeks)+'</span></div><div style="color:var(--danger);cursor:pointer;font-size:18px;padding:4px" onclick="delCourse('+i+')">×</div></div>').join('')+'</div><button onclick="showAddCourse()" style="width:100%;padding:10px;background:var(--primary-light);color:var(--primary);border:none;border-radius:8px;font-size:13px;cursor:pointer">+ 添加课程</button>',null,true)}
function showAddCourse(){let wOpts='';for(let i=1;i<=20;i++)wOpts+='<option value="'+i+'">'+i+'</option>';showModal('添加课程','<div class="modal-field"><label>课程名称</label><input id="m-c-name" placeholder="如：高等数学" autofocus></div><div class="modal-field"><label>教师</label><input id="m-c-teacher"></div><div class="modal-field"><label>教室</label><input id="m-c-room"></div><div class="modal-field"><label>星期</label><select id="m-c-day">'+DAY_NAMES.map((d,i)=>'<option value="'+(i+1)+'">'+d+'</option>').join('')+'</select></div><div class="modal-field"><label>时段</label><select id="m-c-slot">'+TIME_SLOTS.map((t,i)=>'<option value="'+i+'">'+t.label+'</option>').join('')+'</select></div><div class="modal-field"><label>起始周</label><select id="m-c-w1">'+wOpts+'</select></div><div class="modal-field"><label>结束周</label><select id="m-c-w2">'+wOpts+'</select></div>',()=>{const name=document.getElementById('m-c-name').value.trim();if(!name)return false;const slot=parseInt(document.getElementById('m-c-slot').value);state.schedule.courses.push({name,teacher:document.getElementById('m-c-teacher').value.trim(),room:document.getElementById('m-c-room').value.trim(),day:parseInt(document.getElementById('m-c-day').value),slot,weeks:wk(parseInt(document.getElementById('m-c-w1').value),parseInt(document.getElementById('m-c-w2').value)),color:state.schedule.courses.length%10,id:genId(),periods:['1-2','3-5','6-8','10-12'][slot]||''});save('schedule');renderSchedule();showEditCourses();return true})}
function delCourse(i){if(!confirm('确定删除此课程？'))return;state.schedule.courses.splice(i,1);save('schedule');showEditCourses();renderSchedule()}
function exportData(){const data={};['settings','checkins','todos','lastTodoCheck','schedule','exercises','study','finance','notes','quote'].forEach(k=>data[k]=S.get(k,null));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workbench-backup-'+todayKey()+'.json';a.click()}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);Object.entries(data).forEach(([k,v])=>{if(v!==null)S.set(k,v)});location.reload()}catch(err){alert('导入失败：文件格式错误')}};reader.readAsText(file)};input.click()}
function clearAllData(){if(!confirm('确定清除所有数据？'))return;if(!confirm('再次确认：清除后所有数据将丢失'))return;['settings','checkins','todos','lastTodoCheck','schedule','exercises','study','finance','notes','quote'].forEach(k=>S.del(k));location.reload()}
function showModal(title,content,onSave,hideSave){const box=document.getElementById('modal-box');box.innerHTML='<div class="modal-head"><h3>'+title+'</h3><div class="modal-close" onclick="closeModal()">✕</div></div>'+content+(hideSave?'':'<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-save" id="modal-save-btn">保存</button></div>');document.getElementById('modal-overlay').classList.add('show');if(onSave&&!hideSave)document.getElementById('modal-save-btn').onclick=()=>{if(onSave()!==false)closeModal()};setTimeout(()=>{const f=box.querySelector('input,textarea');if(f)f.focus()},100)}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkTodoAutoConvert();setupAutoWeek();if(currentPage==='home')renderHome()}});
document.addEventListener('DOMContentLoaded',init);
</script>
<div id="pwa-install" style="display:none;position:fixed;bottom:20px;left:16px;right:16px;z-index:999;background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;animation:fadeUp .4s ease"><div style="font-size:28px">📱</div><div style="flex:1;font-size:13px"><strong style="font-size:14px">添加到主屏幕</strong><br><span style="color:var(--text-sec)">像APP一样快速打开工作台</span></div><button onclick="installPWA()" style="background:var(--primary);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;border:none;white-space:nowrap">安装</button><button onclick="dismissPWA()" style="color:var(--text-ter);font-size:18px;padding:4px;background:none;border:none">×</button></div>
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const el=document.getElementById('pwa-install');if(el)el.style.display='flex'});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{document.getElementById('pwa-install').style.display='none'})}}
function dismissPWA(){document.getElementById('pwa-install').style.display='none'}
if(window.matchMedia('(display-mode:standalone)').matches||navigator.standalone){const el=document.getElementById('pwa-install');if(el)el.style.display='none'}
</script>
</body>
</html>
